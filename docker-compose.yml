services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartwaste
      POSTGRES_USER: smartwaste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - waste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwaste -d smartwaste"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartwaste:${POSTGRES_PASSWORD}@db:5432/smartwaste
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  waste_pgdata:
