services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartwaste
      POSTGRES_USER: smartwaste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - waste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwaste -d smartwaste"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartwaste:${POSTGRES_PASSWORD}@db:5432/smartwaste
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      MODEL_PATH: /models/waste_model.pkl
      USE_MODEL_FOR_DISPATCH: ${USE_MODEL_FOR_DISPATCH:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  waste_pgdata:
