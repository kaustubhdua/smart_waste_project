services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartwaste
      POSTGRES_USER: smartwaste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - waste_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwaste -d smartwaste"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://smartwaste:${POSTGRES_PASSWORD}@db:5432/smartwaste
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      MODEL_PATH: /models/waste_model.pkl
      USE_MODEL_FOR_DISPATCH: ${USE_MODEL_FOR_DISPATCH:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
    volumes:
      - ./models:/models:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
volumes:
  waste_pgdata:
