databases:
  - name: wasteops-db
    databaseName: smartwaste
    user: smartwaste
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: "16"
    region: singapore
    ipAllowList: []

services:
  - type: web
    name: wasteops-production
    runtime: docker
    branch: main
    region: singapore
    plan: 1c-2g
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wasteops-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ROUTING_PROVIDER
        value: ors
      - key: ORS_BASE_URL
        value: https://api.heigit.org/openrouteservice/v2
      - key: ORS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://wasteops-production.onrender.com
      - key: USE_MODEL_FOR_DISPATCH
        value: "false"
