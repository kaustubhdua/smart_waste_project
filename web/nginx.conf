server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep browser traffic same-origin and share headers with proxied API responses.
  include /etc/nginx/security-headers.conf;

  location /api/ {
    # Child locations override inherited add_header directives; include the same
    # security headers here so API responses retain them as well as no-store.
    include /etc/nginx/security-headers.conf;
    # Operational data and one-time device/driver credentials must not be cached.
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 3m;
  }

  location ~ ^/(health|openapi\.json|docs|redoc)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
