server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Defense in depth for the current console, which loads Leaflet and
  # OpenStreetMap tiles and currently contains inline scripts/styles.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self' data: https://unpkg.com; connect-src 'self' https: http://localhost:8000 http://127.0.0.1:8000" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
