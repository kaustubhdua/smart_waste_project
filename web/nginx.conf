server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Defense in depth for the current console, which loads Leaflet and
  # OpenStreetMap tiles and currently contains inline scripts/styles.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self' data: https://unpkg.com; connect-src 'self' https:" always;

  # Keep the browser on one origin. The API service is reachable by its
  # Compose DNS name from this container; it is not exposed to the browser.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location = /health/ready {
    proxy_pass http://api:8000/health/ready;
    proxy_set_header Host $host;
  }

  location /docs {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location = /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
