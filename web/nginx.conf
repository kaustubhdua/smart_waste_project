server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Preserve server-level security headers when locations add their own headers.
  add_header_inherit merge;

  # Keep browser traffic same-origin: the browser never needs a direct API host,
  # and the API remains reachable only on the Compose network by default.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; font-src 'self' data: https://unpkg.com; connect-src 'self' https:; upgrade-insecure-requests" always;

  location /api/ {
    # Operational data and one-time device/driver credentials must not be cached.
    add_header Cache-Control "no-store, private" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 3m;
  }

  location ~ ^/(health|openapi\.json|docs|redoc)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
