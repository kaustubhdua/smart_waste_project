name: Platform API
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/platform-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/platform-api.yml"
      - "person2_ml_prediction.py"
      - "person3_fuzzy_logic.py"
      - "app.py"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      API_TOKEN: test-operator-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify schema migration from an empty database
        run: DATABASE_URL=sqlite:///./migration_test.db alembic upgrade head
      - run: python -m compileall -q app
      - name: Validate operator console JavaScript syntax
        working-directory: ${{ github.workspace }}
        run: python -c "from pathlib import Path; import re; html=Path('web/index.html').read_text(); scripts=re.findall(r'<script>(.*?)</script>', html, re.S); assert scripts and any(s.strip() for s in scripts); Path('/tmp/operator-console.js').write_text('\\n'.join(scripts))" && node --check /tmp/operator-console.js
